name: Native source qualification (no installers)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: clippy, rustfmt
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix ui
      - run: npm --prefix ui run check
      - run: npm --prefix ui run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
        env:
          FABSPEED_PUBLICATION_EVIDENCE: ${{ runner.temp }}/fabapps-snapshots
      - run: cargo build --workspace --locked
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/check_fabapps_catalogue.py
      - name: Replay actual Unix publications
        if: runner.os == 'Linux'
        run: python scripts/check_fabapps_publication_replay.py "${{ runner.temp }}/fabapps-snapshots"
      # Windows currently checks refusal only. No publication PASS until a native backend is qualified.
