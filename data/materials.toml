# Matières : constantes empiriques normalisées au diamètre de fraise (fraise carbure).
#
#   vc_m_min            vitesse de coupe cible (m/min) → rotation N = Vc × 1000 / (π × D)
#   k_fz                avance par dent nominale par mm de diamètre → fz = D × k_fz
#   k_ap                profondeur de passe nominale en rainure par mm de diamètre → ap = D × k_ap
#   kc_n_mm2            pression spécifique de coupe (N/mm²) → puissance et efforts estimés
#   fz_min_mm           copeau minimal : en dessous, la fraise frotte et chauffe
#   default_stepover    pas latéral par défaut des poches (fraction de D)
#   max_profile_thickness_mm   épaisseur max à détourer en plein (métaux)
#   supervision_required       usinage accompagné d'un fabmanager
#
# Calibrage (voir docs/CALCULATION_MODEL.md § Calibrage) : les constantes bois,
# POM et métaux ont été choisies pour que le modèle, en mode Normal sur la
# ShopBot, reste en dessous des réglages testés du wiki du lab (avance et
# profondeur), tout en restant au-dessus du seuil de frottement.
# Les autres matières partent de références générales prudentes : evidence = "theoretical".

[[materials]]
id = "material/wood.plywood"
name = "Contreplaqué"
category = "panel"
description = "Peuplier, bouleau, okoumé… Collé en plis croisés : les éclats de surface sont fréquents."
vc_m_min = 280
k_fz = 0.035
k_ap = 0.42
kc_n_mm2 = 60
fz_min_mm = 0.02
default_stepover = 0.4
default_thickness_mm = 18
tips = [
  "Une fraise downcut garde le dessus propre, une upcut le dessous.",
  "Pour des bords parfaits : passes de dégrossissage en downcut, dernière passe en upcut.",
]
source = "Constantes génériques calées sous les essais historiques du wiki du lab"
evidence = "theoretical"

