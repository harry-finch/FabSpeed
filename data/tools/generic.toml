# Fraises génériques livrées avec FabSpeed.
#
# Géométries courantes en atelier (diamètre, dents, longueur utile, type),
# sans données fournisseur : aucune rotation constructeur, aucune référence
# commerciale. Mesurez votre fraise et ajustez la fiche (Bibliothèque), ou
# importez votre bibliothèque FabCAM. Les réglages de coupe ne sont PAS ici :
# ils viennent du calcul, puis des essais notés au lab (data/lab/trials/).
# `flutes` absent = nombre de dents inconnu (denture taille diamant).

